<!DOCTYPE html>
<html>
  <head>
    <title>Inventory Management</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
        <h1>Inventory and Reorder Intelligence</h1>
        <p>Track stock and identify items that need reordering.</p>
    </header>
    <div class = "container">
        <div class = "cards">
            <div class = "card">
                <h2 id = "totalCount">0</h2>
                <p>Total Items</p>
            </div>
            <div class = "card">
                <h2 id = "lowCount">0</h2>
                <p>Low Stock</p>
            </div>
            <div class = "card">
                <h2 id = "outCount">0</h2>
                <p>Out of Stock</p>
            </div>
        </div>
        <div class = "formBox">
            <h2 id = "formTitle">Add Inventory Item</h2>
            <input type = "text" id = "itemName" placeholder = "Item name">
            <select id = "category">
                <option value = "">Select Category</option>
                <option>Electronics</option>
                <option>Stationery</option>
                <option>Office Supplies</option>
                <option>Cleaning Supplies</option>
                <option>Other</option>
            </select>
            <input type = "number" id = "quantity" placeholder = "Quantity">
            <input type = "number" id = "reorderLevel" placeholder = "Reorder Level">
            <button onclick="saveItem()">Save Item</button>
            <button onclick="clearItem()">Clear</button>
            <div id = "error" class = "error"></div>
        </div>
        <div class = "formBox">
            <input type = "text"  id="search" placeholder = "Search Items..." onkeyup="displayItems()">
            <select id = "filterCategory" onchange = "displayItems()">
                <option value = "">Select Category</option>
                <option>Electronics</option>
                <option>Stationery</option>
                <option>Office Supplies</option>
                <option>Cleaning Supplies</option>
                <option>Other</option>
            </select>
            <select id = "sortQuantity" onchange = "displayItems()">
                <option value = "">Sort by Quantity</option>
                <option value = "low">Lowest first</option>
                <option value = "high">Highest first</option>
            </select>
        </div>
        <div class = "tableBox">
            <h2>Inventory</h2>
            <table>
                <thead>
                    <tr>
                        <th>Item Name</th>
                        <th>Category</th>
                        <th>Quantity</th>
                        <th>Reorder Level</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id = "inventoryTable"></tbody>
            </table>
            <div id = "emptyMessage" style = "display : none;">No items in inventory.</div>
        </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
