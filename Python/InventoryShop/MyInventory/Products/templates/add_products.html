<!DOCTYPE html>
<html>
    <head>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    </head>
    <body>
        
        <h1>Add Products</h1>
        <div class="container mt-4">
            <div class="card shadow-sm">
                <div class="card-header bg-light">
                <h4 class="mb-0 text-primary">Add New Product</h4>
                </div>
                <div class="card-body">
                <form method="POST">
                    {% csrf_token %}

                    <!-- Show any validation errors at the top -->
                    {% if form.errors %}
                        <div class="alert alert-danger">
                        {{ form.errors }}
                        </div>
                    {% endif %}

                    <div class="row g-3 mb-3">
                        <div class="col-md-8">
                        <label for="productName" class="form-label">Product Name</label>
                        <!-- Must be name="name" -->
                        <input type="text" class="form-control" id="productName" name="name" value="{{ form.name.value|default:'' }}" required>
                        </div>

                        <div class="col-md-4">
                        <label for="productPrice" class="form-label">Price</label>
                        <div class="input-group">
                            <span class="input-group-text">₹</span>
                            <!-- Must be name="price" -->
                            <input type="number" class="form-control" id="productPrice" name="price" step="0.01" min="0" value="{{ form.price.value|default:'' }}" required>
                        </div>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="productDesc" class="form-label">Description</label>
                        <!-- Must be name="description" -->
                        <textarea class="form-control" id="productDesc" name="description" rows="3" required>{{ form.description.value|default:'' }}</textarea>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <button type="reset" class="btn btn-outline-secondary">Clear</button>
                        <button type="submit" class="btn btn-primary">Save Product</button>
                    </div>
                    </form>

                </div>
            </div>
            </div>
        <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
    </body>
</html>
