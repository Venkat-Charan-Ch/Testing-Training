<!DOCTYPE html>
<html>
  <head>
    <title>Element Creator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Elements Creator Form</h1>
    <form id = "tagForm">
        <label for = "tag">Tag: <input type = "text" name = "tag" required></label>
        <label for = "tagContent">Tag Content: <input type = "text" name = "tagContent"></label>
        <label for = "attribute">Attribute: <input type = "text" name = "attribute"></label>
        <label for = "attributeValue">Attribute Value: <input type = "text" name = "attributeValue"></label>
        <br><br>
        <button type="submit">Create</button>
    </form>
    <script src="script.js"></script>
  </body>
</html>
